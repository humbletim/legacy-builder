name: Build Clang Toolchain

on:
  workflow_dispatch:
    inputs:
      clang-version:
        description: 'Clang version to build'
        required: true
        default: '19.1.0'
      llvm-projects:
        description: 'LLVM projects to enable (semicolon-separated)'
        required: true
        default: 'clang;lld'
      target-archs:
        description: 'Target architectures to build (semicolon-separated)'
        required: true
        default: 'X86'

jobs:
  prepare-builder:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/clang-builder
          tags: type=sha,prefix={{date 'YYYYMMDD'}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checkout-source:
    runs-on: ubuntu-latest
    steps:
      - name: Cache LLVM source
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: llvm-project
          key: llvm-src-${{ github.event.inputs.clang-version }}
      - name: Checkout LLVM project
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-${{ github.event.inputs.clang-version }}
          path: llvm-project

  build:
    runs-on: ubuntu-latest
    needs: [prepare-builder, checkout-source]
    steps:
      - name: Restore LLVM source from cache
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-src-${{ github.event.inputs.clang-version }}
      - name: Start builder container
        run: |
          docker pull ${{ needs.prepare-builder.outputs.image-tag }}
          docker run -d --name builder \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ needs.prepare-builder.outputs.image-tag }} tail -f /dev/null
      - name: Build Clang
        run: |
          docker exec builder /bin/bash -c "
            set -eux
            mkdir build
            cd build
            cmake ../llvm-project/llvm -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS='${{ github.event.inputs.llvm-projects }}' \
              -DLLVM_TARGETS_TO_BUILD='${{ github.event.inputs.target-archs }}' \
              -DCMAKE_INSTALL_PREFIX=/opt/clang \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF
            cmake --build . --target install
          "
      - name: Package toolchain
        run: |
          docker exec builder /bin/bash -c "
            tar -czf clang-toolchain.tar.gz -C /opt/clang .
          "
      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-toolchain-${{ github.event.inputs.clang-version }}-${{ runner.os }}
          path: clang-toolchain.tar.gz
      - name: Stop builder container
        if: always()
        run: |
          docker stop builder || true
          docker rm builder || true
