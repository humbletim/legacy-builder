name: Build Clang

on:
  workflow_dispatch:
    inputs:
      clang-version:
        description: 'Clang version to build'
        required: true
        default: '19.1.0'
      llvm-projects:
        description: 'LLVM projects to enable (semicolon-separated)'
        required: true
        default: 'clang;lld'
      target-archs:
        description: 'Target architectures to build (semicolon-separated)'
        required: true
        default: 'X86'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Cache Python installation
      id: cache-python
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/python-install
        key: ${{ runner.os }}-python-3.8.18
    - name: Checkout LLVM project
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        ref: llvmorg-${{ github.event.inputs.clang-version }}
        path: llvm-project
    - name: Build in Docker container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace ubuntu:16.04 /bin/bash -c "
          set -eux
          # Update and install dependencies
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libffi-dev libgdbm-dev \
            libncurses5-dev libreadline-dev libsqlite3-dev libssl-dev libnss3-dev \
            ninja-build wget zlib1g-dev
          # Build Python if not cached
          if [ ! -f /workspace/python-install/bin/python3.8 ]; then
            wget https://www.python.org/ftp/python/3.8.18/Python-3.8.18.tgz
            tar -xf Python-3.8.18.tgz
            cd Python-3.8.18
            ./configure --enable-optimizations --prefix=/workspace/python-install
            make -j \$(nproc)
            make install
            cd ..
          fi
          # Configure and build Clang
          cmake -S /workspace/llvm-project/llvm -B /workspace/build -G Ninja \
            -DPYTHON_EXECUTABLE=/workspace/python-install/bin/python3.8 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS='${{ github.event.inputs.llvm-projects }}' \
            -DLLVM_TARGETS_TO_BUILD='${{ github.event.inputs.target-archs }}' \
            -DCMAKE_INSTALL_PREFIX=/workspace/clang-install \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF
          cmake --build /workspace/build --target install
          # Package toolchain
          tar -czf /workspace/clang-toolchain.tar.gz -C /workspace/clang-install .
        "
    - name: Upload toolchain artifact
      uses: actions/upload-artifact@v4
      with:
        name: clang-toolchain-${{ github.event.inputs.clang-version }}
        path: clang-toolchain.tar.gz
