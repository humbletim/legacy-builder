name: Build Clang

on:
  workflow_dispatch:
    inputs:
      clang-version:
        description: 'Clang version to build'
        required: true
        default: '19.1.0'
      llvm-projects:
        description: 'LLVM projects to enable (semicolon-separated)'
        required: true
        default: 'clang;lld'
      target-archs:
        description: 'Target architectures to build (semicolon-separated)'
        required: true
        default: 'X86'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:16.04
    steps:
    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          cmake \
          curl \
          git \
          libffi-dev \
          libgdbm-dev \
          libncurses5-dev \
          libreadline-dev \
          libsqlite3-dev \
          libssl-dev \
          libnss3-dev \
          ninja-build \
          wget \
          zlib1g-dev
    - name: Build and install Python
      run: |
        wget https://www.python.org/ftp/python/3.8.18/Python-3.8.18.tgz
        tar -xf Python-3.8.18.tgz
        cd Python-3.8.18
        ./configure --enable-optimizations
        make -j $(nproc)
        make altinstall
    - name: Checkout LLVM project
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        ref: llvmorg-${{ github.event.inputs.clang-version }}
        path: llvm-project
    - name: Configure and build Clang
      shell: bash
      run: |
        cmake -S llvm-project/llvm -B build -G Ninja \
          -DPYTHON_EXECUTABLE=/usr/local/bin/python3.8 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS="${{ github.event.inputs.llvm-projects }}" \
          -DLLVM_TARGETS_TO_BUILD="${{ github.event.inputs.target-archs }}" \
          -DCMAKE_INSTALL_PREFIX=/opt/clang \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_INCLUDE_BENCHMARKS=OFF
        cmake --build build --target install
    - name: Package toolchain
      run: |
        tar -czf clang-toolchain.tar.gz -C /opt/clang .
    - name: Upload toolchain artifact
      uses: actions/upload-artifact@v4
      with:
        name: clang-toolchain-${{ github.event.inputs.clang-version }}
        path: clang-toolchain.tar.gz
